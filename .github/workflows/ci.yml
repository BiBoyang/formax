name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
            web_reference:
              - 'apps/web-reference-react/**'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.web_reference == 'true'
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.code == 'true'
        with:
          bun-version: latest

      - name: Install deps
        if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck + boundary checks
        if: steps.changes.outputs.code == 'true'
        run: bun run type-check

      - name: Tests (with coverage)
        if: steps.changes.outputs.code == 'true'
        run: bun run test:coverage

      - name: Install web-reference-react deps
        if: steps.changes.outputs.web_reference == 'true'
        run: npm ci --prefix apps/web-reference-react

      - name: Web reference typecheck
        if: steps.changes.outputs.web_reference == 'true'
        run: npm --prefix apps/web-reference-react run type-check

      - name: Web reference tests
        if: steps.changes.outputs.web_reference == 'true'
        run: npm --prefix apps/web-reference-react run test

      - name: Upload coverage to Codecov
        if: steps.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Skip (no code changes)
        if: steps.changes.outputs.code != 'true' && steps.changes.outputs.web_reference != 'true'
        run: echo "No code or web-reference changes; skipping checks."

  harness-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
            harness_governance:
              - 'plans/harness-refactor-loop/**'
              - 'docs/harness/**'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.harness_governance == 'true'
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.code == 'true'
        with:
          bun-version: latest

      - name: Install deps
        if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Harness type-check
        if: steps.changes.outputs.code == 'true'
        run: bun run type-check

      - name: Harness semantic gate
        if: steps.changes.outputs.code == 'true'
        run: bun run test:repl-semantic-gate

      - name: Harness layer contract
        if: steps.changes.outputs.code == 'true'
        run: bun run check:layer-contracts

      - name: Harness golden principles
        if: steps.changes.outputs.code == 'true'
        run: bun run check:golden-principles

      - name: Harness presenter parity (warn-only)
        if: steps.changes.outputs.code == 'true'
        continue-on-error: true
        run: bun run check:presenter-parity

      - name: Harness plan traceability
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.harness_governance == 'true'
        run: node ./scripts/check-plan-traceability.mjs

      - name: Skip (no code changes)
        if: steps.changes.outputs.code != 'true' && steps.changes.outputs.harness_governance != 'true'
        run: echo "No code or harness-governance changes; skipping harness checks."

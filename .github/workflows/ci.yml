name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
            web_reference:
              - 'packages/web-reference-react/**'
              - 'packages/semantics/**'
              - 'packages/shared/**'
              - 'packages/core/src/features/semantics/**'
              - 'packages/core/src/shared/**'
              - 'packages/core/src/prompts/**'
              - 'packages/core/src/streaming/**'
              - 'packages/core/src/features/tools/presentation/paramsText.ts'
              - 'src/features/semantics/**'
              - 'src/shared/**'
              - 'src/prompts/**'
              - 'src/streaming/**'
              - 'src/features/tools/presentation/paramsText.ts'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.web_reference == 'true'
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.web_reference == 'true'
        with:
          bun-version: latest

      - name: Install deps
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.web_reference == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck + boundary checks
        if: steps.changes.outputs.code == 'true'
        run: bun run type-check

      - name: Tests (with coverage)
        if: steps.changes.outputs.code == 'true'
        run: bun run test:coverage

      - name: Web reference typecheck
        if: steps.changes.outputs.web_reference == 'true'
        run: bun run --cwd packages/web-reference-react type-check

      - name: Web reference tests
        if: steps.changes.outputs.web_reference == 'true'
        run: bun run --cwd packages/web-reference-react test

      - name: Install web reference Playwright browser
        if: steps.changes.outputs.web_reference == 'true'
        run: bun run --cwd packages/web-reference-react test:e2e:install

      - name: Web reference rpc queue stability guard
        if: steps.changes.outputs.web_reference == 'true'
        run: bun run --cwd packages/web-reference-react test:e2e:queue:guard

      - name: Web reference transcript performance gate
        if: steps.changes.outputs.web_reference == 'true'
        run: bun run --cwd packages/web-reference-react test:perf:gate

      - name: Web reference build
        if: steps.changes.outputs.web_reference == 'true'
        run: bun run --cwd packages/web-reference-react build

      - name: Web reference bundle baseline sync
        if: steps.changes.outputs.web_reference == 'true'
        run: bun run --cwd packages/web-reference-react perf:bundle:baseline:sync

      - name: Web reference bundle baseline guard
        if: steps.changes.outputs.web_reference == 'true'
        run: bun run --cwd packages/web-reference-react perf:bundle:baseline:check:ci

      - name: Upload coverage to Codecov
        if: steps.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          branch: main
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Skip (no code changes)
        if: steps.changes.outputs.code != 'true' && steps.changes.outputs.web_reference != 'true'
        run: echo "No code or web-reference changes; skipping checks."

  harness-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
            harness_governance:
              - 'plans/harness-refactor-loop/**'
              - 'docs/harness/**'
            docs_policy:
              - 'docs/**'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.harness_governance == 'true' || steps.changes.outputs.docs_policy == 'true'
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.harness_governance == 'true' || steps.changes.outputs.docs_policy == 'true'
        with:
          bun-version: latest

      - name: Install deps
        if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Harness type-check
        if: steps.changes.outputs.code == 'true'
        run: bun run type-check

      - name: Harness semantic gate
        if: steps.changes.outputs.code == 'true'
        run: bun run test:repl-semantic-gate

      - name: Harness layer contract
        if: steps.changes.outputs.code == 'true'
        run: bun run check:layer-contracts

      - name: Harness golden principles
        if: steps.changes.outputs.code == 'true'
        run: bun run check:golden-principles

      - name: Harness presenter parity (warn-only)
        if: steps.changes.outputs.code == 'true'
        continue-on-error: true
        run: bun run check:presenter-parity

      - name: Harness plan traceability
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.harness_governance == 'true'
        run: bun run check:plan-traceability

      - name: Harness docs artifact placement
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.docs_policy == 'true'
        run: bun run check:docs-artifact-placement

      - name: Skip (no code changes)
        if: steps.changes.outputs.code != 'true' && steps.changes.outputs.harness_governance != 'true' && steps.changes.outputs.docs_policy != 'true'
        run: echo "No code, harness-governance, or docs-policy changes; skipping harness checks."

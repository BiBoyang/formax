<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formax App Server Reference Client</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-title">Formax App Server</div>
          <div class="badge">Reference</div>
        </div>

        <div class="toolbar">
          <button id="newThreadBtn" class="button primary" type="button">New Thread</button>
          <button id="refreshThreadsBtn" class="button secondary" type="button">Refresh</button>
        </div>

        <section>
          <div class="thread-list" id="threadList"></div>
        </section>
      </aside>

      <section class="main">
        <header class="main-header">
          <div class="breadcrumbs">
            <span>App Server</span>
            <span class="muted">/</span>
            <span class="muted">Web Reference Client</span>
          </div>
          <div class="status" id="connectionStatus">Disconnected</div>
        </header>

        <section class="transcript" id="transcript"></section>

        <form class="composer" id="composerForm">
          <textarea id="composerInput" placeholder="Send a message to the active thread" required></textarea>
          <div class="action-dock">
            <button id="interruptBtn" class="button secondary" type="button">Interrupt</button>
            <button id="sendBtn" class="button primary" type="submit">Send Turn</button>
          </div>
        </form>
      </section>

      <aside class="context">
        <div>
          <strong>Pending Inputs</strong>
        </div>
        <div class="pending-list" id="pendingList"></div>
        <div class="empty" id="pendingEmpty">No pending approval or question.</div>
      </aside>
    </main>

    <div class="modal-backdrop" id="inputModalBackdrop">
      <div class="modal" id="inputModal">
        <h2 class="modal-title" id="modalTitle">Pending Input</h2>
        <div id="modalBody"></div>
        <div class="action-dock">
          <button id="dismissModalBtn" class="button secondary" type="button">Dismiss</button>
          <button id="submitInputBtn" class="button primary" type="button">Submit</button>
        </div>
      </div>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
